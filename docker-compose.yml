services:
  postgres:
    image: postgres:17.6
    container_name: collegeops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collegeops}
      POSTGRES_USER: ${POSTGRES_USER:-collegeops}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - collegeops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collegeops} -d ${POSTGRES_DB:-collegeops}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  collegeops-postgres-data:
