spring:
  application:
    name: collegeops-api
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${MAX_DOCUMENT_SIZE:10MB}
      max-request-size: ${MAX_DOCUMENT_REQUEST_SIZE:11MB}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/collegeops}
    username: ${DATABASE_USERNAME:collegeops}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      access-token-ttl: PT10M
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  documents:
    storage-root: ${DOCUMENT_STORAGE_ROOT:./.data/documents}
    max-file-bytes: ${MAX_DOCUMENT_BYTES:10485760}
